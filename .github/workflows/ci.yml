name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push has nothing useful to say; cancel it rather than paying for
# a run whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pong3ds

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can fail without a console or a devkitARM toolchain.
  #
  # The C codec test runs here deliberately: it is plain C99 with no libctru
  # dependency, so CI can prove the 3DS's wire format still matches the
  # TypeScript encoder. That is the check most likely to catch a real
  # cross-platform break, and it costs seconds.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      # The generated codecs are committed so the C build needs no Node. That
      # only stays trustworthy if CI proves they match protocol.json.
      - name: Protocol codegen is up to date
        run: |
          node tools/gen-protocol.mjs
          if ! git diff --quiet -- shared/gen 3ds/source/net/pong_proto.h \
                 3ds/source/net/pong_proto.c 3ds/test/golden_data.h \
                 3ds/source/game/pong_trig.h; then
            echo "::error::Generated files are stale. Run 'make proto' and commit the result."
            git --no-pager diff --stat -- shared/gen 3ds/source/net 3ds/test
            exit 1
          fi
          echo "no drift"

      - name: Install server deps
        run: npm ci --prefix server --no-audit --no-fund

      - name: Server typecheck
        run: npm run --prefix server typecheck

      - name: Simulation tests
        run: npm run --prefix server test

      # Proves the C the console runs agrees with the TypeScript the server
      # runs, byte for byte, under ASan/UBSan. clang to match local dev.
      - name: C codec conformance (vs TypeScript encoder)
        env:
          CC: clang
        run: make -C 3ds/test -f Makefile.host run

      - name: Install web deps
        run: npm ci --prefix web --no-audit --no-fund

      - name: Web typecheck and build
        run: npm run --prefix web build

      - name: Bundle size
        run: |
          set -eo pipefail
          js=$(find web/dist/assets -name '*.js' ! -name '*.map' | head -1)
          raw=$(wc -c < "$js")
          gz=$(gzip -c "$js" | wc -c)
          echo "### Web bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | bytes | kB |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | $raw | $((raw/1024)) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzip | $gz | $((gz/1024)) |" >> "$GITHUB_STEP_SUMMARY"
          # A ceiling rather than a ratchet: it should catch someone importing
          # something enormous, not nag about ordinary growth.
          limit=$((400 * 1024))
          if [ "$gz" -gt "$limit" ]; then
            echo "::error::gzipped bundle ${gz}B exceeds ${limit}B"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish the server image (which contains the built web client) to GHCR.
  #
  # linux/amd64 only: rdesktop.local is x86_64, and cross-building arm64 under
  # QEMU would multiply the build time for an image nothing would pull.
  # ---------------------------------------------------------------------------
  image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    # Never publish from a pull request: the token is read-only there, and an
    # unreviewed branch should not be able to move :latest.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Pong3DS
            org.opencontainers.image.description=Cross-play Pong between a browser and a Nintendo 3DS

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Values reach the shell through env, never by template interpolation
      # into the script body: tag names are attacker-influencable in the general
      # case, and `${{ }}` inside run: is textual substitution, not quoting.
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_NUM: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo ""
            printf 'Build `%s` · commit `%s`\n' "$BUILD_NUM" "$SHA"
            echo ""
            echo "Deploy it:"
            echo '```bash'
            printf 'docker pull %s:latest\n' "$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
