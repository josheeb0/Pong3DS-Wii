name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push has nothing useful to say; cancel it rather than paying for
# a run whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pong3ds

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can fail without a console or a devkitARM toolchain.
  #
  # The C codec test runs here deliberately: it is plain C99 with no libctru
  # dependency, so CI can prove the 3DS's wire format still matches the
  # TypeScript encoder. That is the check most likely to catch a real
  # cross-platform break, and it costs seconds.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      # The generated codecs are committed so the C build needs no Node. That
      # only stays trustworthy if CI proves they match protocol.json.
      - name: Protocol codegen is up to date
        run: |
          node tools/gen-protocol.mjs
          if ! git diff --quiet -- shared/gen 3ds/source/net/pong_proto.h \
                 3ds/source/net/pong_proto.c 3ds/test/golden_data.h \
                 3ds/source/game/pong_trig.h; then
            echo "::error::Generated files are stale. Run 'make proto' and commit the result."
            git --no-pager diff --stat -- shared/gen 3ds/source/net 3ds/test
            exit 1
          fi
          echo "no drift"

      - name: Install server deps
        run: npm ci --prefix server --no-audit --no-fund

      - name: Server typecheck
        run: npm run --prefix server typecheck

      - name: Simulation tests
        run: npm run --prefix server test

      # Proves the C the console runs agrees with the TypeScript the server
      # runs, byte for byte, under ASan/UBSan. clang to match local dev.
      - name: C codec conformance (vs TypeScript encoder)
        env:
          CC: clang
        run: make -C 3ds/test -f Makefile.host run

      - name: Install web deps
        run: npm ci --prefix web --no-audit --no-fund

      - name: Web tests
        run: npm run --prefix web test

      - name: Web typecheck and build
        run: npm run --prefix web build

      - name: Bundle size
        run: |
          set -eo pipefail
          js=$(find web/dist/assets -name '*.js' ! -name '*.map' | head -1)
          raw=$(wc -c < "$js")
          gz=$(gzip -c "$js" | wc -c)
          echo "### Web bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | bytes | kB |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | $raw | $((raw/1024)) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzip | $gz | $((gz/1024)) |" >> "$GITHUB_STEP_SUMMARY"
          # A ceiling rather than a ratchet: it should catch someone importing
          # something enormous, not nag about ordinary growth.
          limit=$((400 * 1024))
          if [ "$gz" -gt "$limit" ]; then
            echo "::error::gzipped bundle ${gz}B exceeds ${limit}B"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish the server image (which contains the built web client) to GHCR.
  #
  # linux/amd64 only: rdesktop.local is x86_64, and cross-building arm64 under
  # QEMU would multiply the build time for an image nothing would pull.
  # ---------------------------------------------------------------------------
  image:
    name: Publish image
    needs: [verify, cia]
    runs-on: ubuntu-latest
    # Never publish from a pull request: the token is read-only there, and an
    # unreviewed branch should not be able to move :latest.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Ship the console build inside the server image, so /downloads always
      # serves the .3dsx matching the BUILD_ID the server reports.
      - name: Fetch the 3DS build
        uses: actions/download-artifact@v7
        with:
          name: pong3ds-build-${{ github.run_number }}
          path: deploy/downloads

      - name: Confirm what will be shipped
        run: ls -la deploy/downloads

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Pong3DS
            org.opencontainers.image.description=Cross-play Pong between a browser and a Nintendo 3DS

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
            RELEASE_URL=${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Values reach the shell through env, never by template interpolation
      # into the script body: tag names are attacker-influencable in the general
      # case, and `${{ }}` inside run: is textual substitution, not quoting.
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_NUM: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo ""
            printf 'Build `%s` · commit `%s`\n' "$BUILD_NUM" "$SHA"
            echo ""
            echo "Deploy it:"
            echo '```bash'
            printf 'docker pull %s:latest\n' "$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build the 3DS client and publish it to Releases.
  #
  # Split deliberately across two environments, because neither can do the whole
  # job:
  #
  #   - The toolchain runs in devkitpro/devkitarm. Installing the SDK on the
  #     runner instead would be simpler, but apt.devkitpro.org answers 403 to
  #     everything (bot protection), so that route is unavailable from CI.
  #
  #   - Packaging runs on the RUNNER, not in that container. The image is Debian
  #     bookworm (glibc 2.36) and makerom links against 2.38, so building the
  #     .cia inside it dies with GLIBC_2.38 at the very last step. The runner has
  #     2.39.
  #
  # Both halves were reproduced locally in Docker before being written here.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------- mac -----
  #
  # The desktop build, on a real macOS runner because a Mac binary cannot be
  # cross-compiled from Linux. Runs on Apple silicon (macos-14+ is arm64), so
  # the artifact is named for what it actually is rather than "mac".
  mac:
    name: Build Mac (SDL3)
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: brew install sdl3

      - name: Build
        run: make -C pc

      - name: Bundle SDL3 alongside the binary
        run: |
          set -euo pipefail
          # A bare binary links against Homebrew's dylib at an absolute path
          # that exists on this runner and on nobody else's machine. Copying the
          # library in and rewriting the load path means the zip runs without
          # the person downloading it having to install anything.
          STAGE=pong-pc-macos-arm64
          mkdir -p "$STAGE"
          cp pc/pong-pc "$STAGE/"

          SDL=$(otool -L pc/pong-pc | awk '/libSDL3/ {print $1; exit}')
          echo "linked against: $SDL"
          cp "$SDL" "$STAGE/"
          SDL_BASE=$(basename "$SDL")

          install_name_tool -change "$SDL" "@executable_path/$SDL_BASE" "$STAGE/pong-pc"
          otool -L "$STAGE/pong-pc"

          cat > "$STAGE/README.txt" <<'EOF'
          Pong - desktop build (macOS, Apple silicon)

            ./pong-pc

          macOS will refuse an unsigned download the first time. Either
          right-click the binary and choose Open, or run:

            xattr -d com.apple.quarantine pong-pc libSDL3.0.dylib

          Settings live in pong-pc.cfg beside the binary, and SERVER and NAME
          are editable from the menu.

          This build speaks raw TCP to a server on your network. It does not do
          HTTPS -- to play over the internet, open the web client instead.

          Controls: arrows or W/S, mouse, or a gamepad (a DualSense works as-is).
          Enter selects, Esc goes back.
          EOF

          zip -r "$STAGE.zip" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: pong-pc-macos-arm64.zip
          if-no-files-found: error


  # -------------------------------------------------------------- linux -----
  #
  # SDL3 is new enough that no LTS ships libsdl3-dev yet, so it is built from
  # source and cached on its version. That is slow once and free afterwards,
  # and it pins exactly what the binary links against rather than inheriting
  # whatever a distro decides later.
  linux:
    name: Build Linux (SDL3)
    needs: verify
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: "3.4.16"
    steps:
      - uses: actions/checkout@v4

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev \
            libxss-dev libxtst-dev libxxf86vm-dev libdrm-dev libgbm-dev \
            libudev-dev libibus-1.0-dev patchelf

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "release-${SDL_VERSION}" \
            https://github.com/libsdl-org/SDL.git /tmp/SDL
          # X11 extras are optional for a game window; turning the ones we do
          # not use off is more robust than chasing every -dev package a full
          # SDL build would like to have.
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_X11_XSCRNSAVER=OFF \
            -DSDL_X11_XDBE=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install"
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3-install/lib/pkgconfig:$HOME/sdl3-install/lib64/pkgconfig"
          make -C pc

      - name: Bundle SDL3 alongside the binary
        run: |
          set -euo pipefail
          # Same reasoning as the Mac job: the binary links a library that lives
          # in a path unique to this runner. It is copied in and found through
          # an rpath relative to the executable, so the tarball runs on a
          # machine that has never heard of SDL3.
          STAGE=pong-pc-linux-x86_64
          mkdir -p "$STAGE"
          cp pc/pong-pc "$STAGE/"
          cp -L "$HOME"/sdl3-install/lib*/libSDL3.so* "$STAGE/" 2>/dev/null || true
          patchelf --set-rpath '$ORIGIN' "$STAGE/pong-pc" 2>/dev/null || \
            (sudo apt-get install -y patchelf && patchelf --set-rpath '$ORIGIN' "$STAGE/pong-pc")
          ldd "$STAGE/pong-pc" || true

          cat > "$STAGE/README.txt" <<'EOF'
          Pong - desktop build (Linux x86_64)

            ./pong-pc

          SDL3 is bundled beside the binary and found through an rpath, so
          nothing needs installing.

          Settings live in pong-pc.cfg beside the binary; SERVER and NAME are
          editable from the menu. This build speaks raw TCP to a server on your
          network -- for internet play, open the web client.

          Controls: arrows or W/S, mouse, or a gamepad. Enter selects, Esc back.
          EOF

          tar czf "$STAGE.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: pong-pc-linux-x86_64.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------ windows -----
  #
  # MSVC and native Winsock. net_pc.c already branches on _WIN32 for the socket
  # differences, so the compiler choice costs nothing above that layer -- and
  # an MSVC binary needs no MinGW runtime beside it, only SDL3.dll.
  #
  # Built by invoking cl directly rather than adding CMake: six source files
  # and two libraries do not need a build system, and the one that exists for
  # the other platforms is a Makefile MSVC cannot read.
  windows:
    name: Build Windows (MSVC)
    needs: verify
    runs-on: windows-latest
    env:
      SDL_VERSION: "3.4.16"
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch the SDL3 VC package
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile sdl3.zip
          Expand-Archive -Path sdl3.zip -DestinationPath sdl3 -Force
          Get-ChildItem sdl3

      - name: Build
        shell: cmd
        run: |
          set SDLDIR=sdl3\SDL3-%SDL_VERSION%
          cl /nologo /std:c11 /O2 /W3 /D_CRT_SECURE_NO_WARNINGS ^
             /Ipc /Isrc\gfx /Isrc\ui /I3ds\source\game /I3ds\source\net ^
             /I%SDLDIR%\include ^
             pc\main_sdl.c pc\net_pc.c ^
             src\gfx\sdl3\gfx_sdl3.c src\ui\desktop.c ^
             3ds\source\net\pong_proto.c 3ds\source\game\client.c ^
             /Fe:pong-pc.exe ^
             /link /LIBPATH:%SDLDIR%\lib\x64 SDL3.lib ws2_32.lib
          if errorlevel 1 exit /b 1

      - name: Bundle
        shell: pwsh
        run: |
          $stage = "pong-pc-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item pong-pc.exe $stage
          # SDL3.dll is the only runtime dependency an MSVC build has beyond
          # what Windows itself ships.
          Copy-Item "sdl3\SDL3-$env:SDL_VERSION\lib\x64\SDL3.dll" $stage
          @"
          Pong - desktop build (Windows x64)

            pong-pc.exe

          Keep SDL3.dll beside the exe.

          Settings live in pong-pc.cfg beside the exe; SERVER and NAME are
          editable from the menu. This build speaks raw TCP to a server on your
          network -- for internet play, open the web client.

          Controls: arrows or W/S, mouse, or a gamepad (a DualSense works
          as-is). Enter selects, Esc back.
          "@ | Set-Content "$stage\README.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: pong-pc-windows-x86_64.zip
          if-no-files-found: error

  # --------------------------------------------------------------- vita -----
  #
  # THIS HAS NEVER BUILT. The Vita backend was written without a VitaSDK to
  # hand, so this job exists to find out what is wrong with it -- which is the
  # fastest way to get from "carefully written" to "actually compiles".
  #
  # continue-on-error so a broken Vita build does not hold up a release of the
  # four that do work. Remove it once this has gone green.
  vita:
    name: Build Vita (vita2d)
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      # The image ships a prebuilt libvita2d.a that references sceSharedFbBegin,
      # End and Close -- and no SceSharedFb stub, as listing the stub directory
      # showed: nothing there matches Fb or Shared at all. The library and the
      # stub set in this image disagree with each other, which is not something
      # a link line can fix.
      #
      # Building vita2d from source against the stubs that ARE installed
      # resolves it by construction, and takes about a minute.
      - name: Build vita2d from source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          git clone --depth 1 https://github.com/xerpi/libvita2d.git /tmp/vita2d
          make -C /tmp/vita2d/libvita2d install

      - name: Build
        shell: bash        # the container defaults to dash, which has no pipefail
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          make -C vita

      - uses: actions/upload-artifact@v4
        with:
          name: vita-build
          path: vita/pong-vita.vpk
          if-no-files-found: warn


  cia:
    name: Build 3DS (.3dsx + .cia)
    needs: [verify, mac, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # required to create releases
    steps:
      - uses: actions/checkout@v7

      # mbedTLS is the slow part (a few minutes) and changes only when its
      # version or our cipher config does, so key the cache on exactly those.
      - name: Cache mbedTLS build
        id: mbedtls-cache
        uses: actions/cache@v6
        with:
          path: 3ds/vendor/mbedtls
          key: mbedtls-arm11-${{ hashFiles('3ds/vendor/build-mbedtls.sh', '3ds/vendor/mbedtls_config_3ds.h') }}

      # Runs as the runner's own uid so the artifacts are not left root-owned
      # for the packaging steps that follow. devkitPro's paths come from the
      # image's ENV, so no login shell is needed.
      - name: Build .3dsx (devkitPro container)
        env:
          BUILD_ID: ${{ github.run_number }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e BUILD_ID="$BUILD_ID" \
            devkitpro/devkitarm:latest \
            bash -c 'set -e; ./3ds/vendor/build-mbedtls.sh; make -C 3ds BUILD_ID="$BUILD_ID"'

      - name: Fetch CIA packaging tools
        run: ./3ds/vendor/fetch-tools.sh

      - name: Build .cia
        run: ./3ds/build-cia.sh 3ds/pong3ds.elf 3ds/pong3ds.cia

      - name: Report sizes
        run: |
          {
            echo "### 3DS build"
            echo ""
            echo "| artifact | size |"
            echo "|---|---:|"
            for f in 3ds/pong3ds.3dsx 3ds/pong3ds.cia; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Available on every run, including PRs, so a branch build can be tested
      # on hardware without waiting for a release.
      - uses: actions/upload-artifact@v7
        with:
          name: pong3ds-build-${{ github.run_number }}
          path: |
            3ds/pong3ds.3dsx
            3ds/pong3ds.cia
          retention-days: 30

      - name: Fetch the desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          merge-multiple: true

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUM: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail

          if [ "$IS_TAG" = "true" ]; then
            TAG="$REF_NAME"
            TITLE="Pong3DS $REF_NAME"
            PRERELEASE=""
          else
            TAG="build-$BUILD_NUM"
            TITLE="Build $BUILD_NUM"
            PRERELEASE="--prerelease"
          fi

          # Notes are written to a file rather than passed inline, so nothing
          # from the commit can be interpreted as shell.
          {
            printf 'Build %s (`%s`). One game, one protocol, an interface per platform.\n\n' \
              "$BUILD_NUM" "${SHA:0:7}"
            printf '| file | platform | install |\n|---|---|---|\n'
            printf '| `pong3ds.cia` | 3DS | Install with FBI. Own HOME-menu title. |\n'
            printf '| `pong3ds.3dsx` | 3DS | Copy to `sd:/3ds/`, launch from the Homebrew Launcher. |\n'
            printf '| `pong-pc-macos-arm64.zip` | macOS (Apple silicon) | Unzip, run `./pong-pc`. SDL3 bundled. |\n'
            printf '| `pong-pc-windows-x86_64.zip` | Windows | Unzip, run `pong-pc.exe`. DLLs included. |\n'
            printf '| `pong-pc-linux-x86_64.tar.gz` | Linux | Extract, run `./pong-pc`. SDL3 bundled. |\n\n'
            printf 'The Mac build speaks **raw TCP only** -- it plays against a server on your\n'
            printf 'network, not through the tunnel. For internet play from a desktop, open the\n'
            printf 'web client. Keyboard, mouse or a gamepad; a DualSense works as-is.\n\n'
            printf 'Tap the server field on the title screen to enter an address:\n\n'
            printf -- '- `pong.wardcrew.com` - HTTPS on 443 (works anywhere)\n'
            printf -- '- `192.168.4.29:8788` - plain HTTP on a LAN\n'
            printf -- '- `tcp://192.168.4.29:8787` - raw TCP fast path, 60Hz\n\n'
            printf 'Press X on the title screen to check for a newer build.\n'
          } > /tmp/notes.md

          # Re-running a workflow reuses the run number, so replace rather than
          # fail on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file /tmp/notes.md \
            $PRERELEASE \
            3ds/pong3ds.cia \
            3ds/pong3ds.3dsx \
            pong-pc-macos-arm64.zip \
            pong-pc-windows-x86_64.zip \
            pong-pc-linux-x86_64.tar.gz

          printf '### Released\n\n[%s](%s)\n' "$TAG" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
