# Runs the Pong server with `docker compose up -d`.
#
# The reason this exists alongside the CapRover deployment: CapRover routes by
# hostname through nginx, which cannot proxy the 3DS's raw TCP port -- nginx
# speaks HTTP. So the console's LAN fast path needs a plain published port, and
# that is exactly what compose is good at.
#
# Both paths are served by one container:
#   8788  HTTP + WebSocket, what the Cloudflare tunnel points at
#   8787  raw TCP, the 3DS's 60Hz LAN path, reachable only on the local network
#
# A console on the same network should be pointed at tcp://<host>:8787 rather
# than at the public hostname -- otherwise it leaves the building, crosses
# Cloudflare's edge and comes back to a machine a few metres away, which is
# roughly ten times the round trip for no benefit.

services:
  pong:
    image: ghcr.io/johndoe6345789/pong3ds:latest
    container_name: pong
    restart: unless-stopped

    ports:
      - "8788:8788"     # HTTP + WebSocket
      - "8787:8787"     # raw TCP for the 3DS on the LAN

    environment:
      HTTP_PORT: "8788"
      TCP_PORT: "8787"
      # Used by the browser client to build URLs, and shown at /healthz.
      PUBLIC_ORIGIN: "https://pong.wardcrew.com"
      LOG_LEVEL: "info"
      # Bound concurrent sessions so a busy host cannot be exhausted by this.
      MAX_SESSIONS: "512"
      # BUILD_ID and GIT_SHA are baked into the CI image. Overriding them here
      # would make /api/version disagree with the console build shipped inside
      # the image, which is what the 3DS updater compares against -- so don't,
      # unless you built the image yourself.

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

    # The simulation is CPU-light but runs a 60Hz loop per room; the cap keeps
    # it from competing with everything else on a shared box.
    deploy:
      resources:
        limits:
          memory: 512M
